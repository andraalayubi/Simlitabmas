version: "3.8"
services:
  # Layanan Next.js
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: simlitabmas_app
    ports:
      - "3000:3000"
    env_file:
      - ./.env.trial
    # environment:
    #   - DATABASE_URL=${DATABASE_URL}
    #   - MINIO_ENDPOINT=${MINIO_ENDPOINT}:${MINIO_PORT}
    #   - MINIO_ROOT_USER=${MINIO_ROOT_USER}
    #   - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    depends_on:
      - db
      - minio
    networks:
      - simlitabmas_network

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: simlitabmas_nginx
    ports:
      - "8080:80"
    depends_on:
      - app
    networks:
      - simlitabmas_network

  # Layanan PostgreSQL
  db:
    image: postgres:15-alpine
    # build:
    #   context: .
    #   dockerfile: docker/database/Dockerfile
    container_name: simlitabmas_db
    env_file:
      - ./.env.trial
    # environment:
    #   POSTGRES_USER: ${POSTGRES_USER}
    #   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    #   POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - simlitabmas_network
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Layanan MinIO
  minio:
    build:
      context: .
      dockerfile: docker/minio/Dockerfile
    container_name: simlitabmas_storage
    # environment:
    #   MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    #   MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    env_file:
      - ./.env.trial
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - simlitabmas_network

volumes:
  pgdata:
  miniodata:

networks:
  simlitabmas_network:
